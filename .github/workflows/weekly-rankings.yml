name: Publish weekly power rankings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-rankings.yml'
  schedule:
    - cron: '5 9 * * 0'
      timezone: 'America/New_York'
permissions:
  contents: write
concurrency:
  group: weekly-power-rankings
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source code
        run: |
          python -m py_compile scripts/update_rankings.py
          node --check assets/app.js
      - name: Capture stats.fm day response
        env:
          STATSFM_USER: 31c4puiblaxm3wzzwg3hfc7t75yq
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          tz=ZoneInfo('America/New_York')
          start=datetime(2026,7,12,9,tzinfo=tz)
          end=datetime(2026,7,19,9,tzinfo=tz)
          params=urllib.parse.urlencode({'after':int(start.timestamp()*1000),'before':int(end.timestamp()*1000),'timeZone':'America/New_York'})
          user=urllib.parse.quote(os.environ['STATSFM_USER'])
          url=f'https://api.stats.fm/api/v1/users/{user}/streams/tracks/345239042/stats/per-day?{params}'
          req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'DantePowerRankings-Debug/1.0'})
          with urllib.request.urlopen(req,timeout=45) as response:
              payload=json.load(response)
          Path('data/debug-per-day.json').write_text(json.dumps(payload,indent=2,ensure_ascii=False))
          PY
      - name: Build closed Sunday edition
        env:
          STATSFM_USER: 31c4puiblaxm3wzzwg3hfc7t75yq
        run: python scripts/update_rankings.py
      - name: Commit successful edition
        run: |
          git config user.name "Spotify Power Rankings Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history/ data/debug-per-day.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish Spotify Power Rankings $(date -u +%F)"
          git push
