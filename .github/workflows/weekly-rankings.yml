name: Publish weekly power rankings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/app.js'
      - 'scripts/publish_rankings.py'
      - '.github/workflows/weekly-rankings.yml'
  schedule:
    - cron: '5 9 * * 0'
      timezone: 'America/New_York'
permissions:
  contents: write
concurrency:
  group: weekly-power-rankings
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source code
        run: |
          python -m py_compile scripts/update_rankings.py scripts/publish_rankings.py
          node --check assets/app.js
      - name: Build closed Sunday edition
        env:
          STATSFM_USER: 31c4puiblaxm3wzzwg3hfc7t75yq
        run: python scripts/publish_rankings.py
      - name: Commit successful edition
        run: |
          git config user.name "Spotify Power Rankings Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history/
          git diff --cached --quiet && exit 0
          git commit -m "Publish Spotify Power Rankings $(date -u +%F)"
          git push
